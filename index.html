<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      Seguridad: la Content-Security-Policy se inyecta SOLO en el build de
      producción (ver el plugin en vite.config.ts) para no romper el HMR del
      dev server. frame-ancestors / HSTS / X-Frame-Options no se pueden fijar
      por <meta> → configurarlos como headers en Cloudflare (ver SECURITY.md).
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Range Soprano · Estudio de rangos preflop de poker</title>
    <meta
      name="description"
      content="Range Soprano: app gratis para estudiar rangos preflop de poker (6-max y HU). Visualizador, editor con pesos mixtos, entrenador, calculadoras de EV, análisis de manos y export a Flopzilla."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://rangesoprano.com/" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f1115" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rangesoprano.com/" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Range Soprano · Estudio de rangos preflop" />
    <meta
      property="og:description"
      content="App gratis para estudiar rangos preflop de poker. Visualizador, editor con pesos mixtos, entrenador, calculadoras de EV, análisis de manos y export a Flopzilla."
    />
    <meta property="og:image" content="https://rangesoprano.com/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Range Soprano · Estudio de rangos preflop" />
    <meta
      name="twitter:description"
      content="App gratuita para estudiar, crear y entrenar rangos preflop de poker."
    />
    <meta name="twitter:image" content="https://rangesoprano.com/og-image.svg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Range Soprano",
        "url": "https://rangesoprano.com/",
        "description": "App de estudio de rangos preflop de poker. Visualizador, editor con pesos mixtos, entrenador, calculadoras de EV, análisis de manos y export a Flopzilla.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Web",
        "inLanguage": "es",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('range-soprano/ui');
          var theme = 'dark';
          if (raw) {
            var parsed = JSON.parse(raw);
            var t = parsed && parsed.state && parsed.state.theme;
            if (t === 'dark' || t === 'light' || t === 'system') theme = t;
          }
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_) {
          /* default already set on <html> */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
