<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Range Soprano — Poker preflop range study app." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f1115" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Range Soprano" />
    <meta property="og:description" content="Build, study and drill poker preflop ranges with mixed frequencies." />
    <meta property="og:image" content="/favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <title>Range Soprano</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('range-soprano/ui');
          var theme = 'dark';
          if (raw) {
            var parsed = JSON.parse(raw);
            var t = parsed && parsed.state && parsed.state.theme;
            if (t === 'dark' || t === 'light' || t === 'system') theme = t;
          }
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_) {
          /* default already set on <html> */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
